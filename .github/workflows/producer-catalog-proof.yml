name: Producer catalog CI repair proof
on:
  push:
    branches: [proof/producer-catalog]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.21.0'
      - name: Install pinned dependencies
        id: install
        run: |
          corepack enable
          corepack install
          pnpm install --frozen-lockfile
      - name: Verify affected sandbox and native-surface fixtures
        run: node scripts/run-vitest.mjs extensions/codex/src/app-server/run-attempt.test.ts --maxWorkers=1 --testNamePattern 'starts active OpenClaw sandbox|routes native Codex execution|disabled native|native surface'
      - name: Verify canonical descendant owner rejection
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/run-vitest.mjs test/canonical-descendant.integration.test.ts --maxWorkers=1
      - name: Verify requester MCP continuity
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/run-vitest.mjs extensions/codex/src/app-server/run-attempt.configured-mcp.test.ts --maxWorkers=1
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm exec oxfmt --check extensions/codex/src/app-server/run-attempt.configured-mcp.test.ts extensions/codex/src/app-server/run-attempt.test.ts test/canonical-descendant.integration.test.ts
      - name: Check changed MCP test lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/run-oxlint.mjs extensions/codex/src/app-server/run-attempt.configured-mcp.test.ts
